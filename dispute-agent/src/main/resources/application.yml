spring:
  application:
    name: dispute-agent
  main:
    web-application-type: none

  ai:
    anthropic:
      # No api-key here: Spring AI reads ANTHROPIC_API_KEY from the environment
      chat:
        options:
          model: claude-haiku-4-5
          temperature: 0.0

    # all-MiniLM-L6-v2 (ONNX) runs locally, so a given text always yields the same vector
    model:
      embedding: transformers

    embedding:
      transformer:
        tokenizer:
          # The jar ships a real tokenizer.json but its model.onnx is a 133-byte Git LFS pointer
          uri: classpath:/onnx/all-MiniLM-L6-v2/tokenizer.json
        cache:
          # Aligns with the directory a bare TransformersEmbeddingModel uses, otherwise the same
          # model is cached twice and one of the two paths re-downloads 86 MB on every run
          directory: ${java.io.tmpdir}/spring-ai-onnx-generative

    mcp:
      client:
        name: dispute-agent
        version: 0.1.0
        type: SYNC
        initialized: true
        # The subprocess boots a full Spring Boot JVM, hence the margin
        request-timeout: 30s
        stdio:
          connections:
            payments:
              command: java
              args:
                - -jar
                - ${dra.mcp.payment-server-jar}

dra:
  agent:
    decision-version: "decision-llm@v1.2.0"
    evidence-version: "evidence-llm@v1.0.0"
    # Spring AI's tool-calling loop exposes no turn limit: this is the only bound
    max-tool-calls: 8
    compliance-version: "compliance-rag@v1.0.0"
  orchestrator:
    # 1000.00 EUR in minor units; a business threshold gets renegotiated, so config not a constant
    escalation-threshold-minor-units: 100000
    # Calendar days, not business days - the rule corpus says so explicitly
    representment-min-days-remaining: 3
    # Distinct from decision-llm@...: marks the decisions taken with no model involved
    version: "orchestrator@v1.0.0"
  validation:
    known-reason-codes: "10.4,11.3,12.6,13.1,13.2,13.3,4808,4834,4837,4853,4855"
  rag:
    # candidates drives recall, top-k drives how much noise reaches the prompt
    candidates: 50
    top-k: 5
    # none is the measurement control arm, not a production strategy
    reranker: heuristic
  mcp:
    # Relative to the module directory; override with -Ddra.mcp.payment-server-jar=/absolute/path.jar
    payment-server-jar: ../mcp-payment-server/target/mcp-payment-server-0.1.0-SNAPSHOT.jar
