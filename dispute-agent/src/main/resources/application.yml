spring:
  application:
    name: dispute-agent

  config:
    import: classpath:prompts/versions.yml

  datasource:
    url: ${DRA_DB_URL:jdbc:postgresql://localhost:5432/dra}
    username: ${DRA_DB_USER:dra}
    password: ${DRA_DB_PASSWORD:dra}

  ai:
    anthropic:
      max-retries: 0
      # The timeout stays with the HTTP client: a Resilience4j TimeLimiter needs an async call
      timeout: 60s
      chat:
        options:
          model: claude-haiku-4-5
          temperature: 0.0
          # Per-call output bound; the per-dispute budget is checked between calls (see ADR-0021)
          max-tokens: 2048

    # all-MiniLM-L6-v2 (ONNX) runs locally, so a given text always yields the same vector
    model:
      embedding: transformers

    embedding:
      transformer:
        tokenizer:
          # The jar ships a real tokenizer.json but its model.onnx is a 133-byte Git LFS pointer
          uri: classpath:/onnx/all-MiniLM-L6-v2/tokenizer.json
        cache:
          directory: ${java.io.tmpdir}/spring-ai-onnx-generative

    mcp:
      client:
        name: dispute-agent
        version: 0.1.0
        type: SYNC
        initialized: true
        request-timeout: 30s
        streamable-http:
          connections:
            payments:
              url: ${DRA_MCP_PAYMENTS_URL:http://localhost:8081}
              endpoint: /mcp

    vectorstore:
      pgvector:
        # Flyway owns the DDL: two owners for one schema means nobody knows what is in the database
        initialize-schema: false
        table-name: rule_chunk
        # Must match the VECTOR(384) of the migration; a mismatch only shows on first insert
        dimensions: 384
        index-type: HNSW
        distance-type: COSINE_DISTANCE

dra:
  security:
    # Empty by default: the application refuses to start without it (see ADR-0020)
    api-key: ${DRA_API_KEY:}
  persistence: ${DRA_PERSISTENCE:jdbc}
  agent:
    # Derived from the pin, never copied: two literals could name different versions
    decision-version: "decision-llm@${dra.prompts.decision}"
    evidence-version: "evidence-llm@${dra.prompts.evidence}"
    # Spring AI's tool-calling loop exposes no turn limit: this is the only bound
    max-tool-calls: 8
  budget:
    evidence-max-tokens: 40000
    decision-max-tokens: 12000
  resilience:
    model:
      max-attempts: 3
      wait: 500ms
      # Short window on purpose: a dispute costs ~3 calls, so a wide one would open far too late
      sliding-window: 10
      failure-rate-threshold: 50
      open-duration: 30s
    mcp:
      max-attempts: 3
      wait: 200ms
      sliding-window: 10
      failure-rate-threshold: 50
      open-duration: 30s
  orchestrator:
    # 1000.00 EUR in minor units; a business threshold gets renegotiated, so config not a constant
    escalation-threshold-minor-units: 100000
    representment-min-days-remaining: 3
    version: "orchestrator@v1.0.0"
  validation:
    known-reason-codes: "10.4,11.3,12.6,13.1,13.2,13.3,4808,4834,4837,4853,4855"
  rag:
    store: ${DRA_RAG_STORE:pgvector}
    candidates: 50
    top-k: 5
    reranker: heuristic
  mcp:
    # Sent as X-MCP-Secret on every outbound call; must match the MCP server
    shared-secret: ${DRA_MCP_SHARED_SECRET:}
    payment-server-jar: ../mcp-payment-server/target/mcp-payment-server-0.1.0-SNAPSHOT.jar
  submission:
    worker-pool-size: 4

server:
  port: ${DRA_SERVER_PORT:8080}
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  otlp:
    metrics:
      export:
        enabled: ${DRA_OTLP_ENABLED:false}
        url: ${DRA_OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
