spring:
  application:
    name: dispute-agent

  # The jar default is the production topology: Postgres + Flyway + pgvector. Tests that need
  # no database activate the `no-db` profile. The password default only unlocks local compose;
  # a real deployment must set DRA_DB_PASSWORD
  datasource:
    url: ${DRA_DB_URL:jdbc:postgresql://localhost:5432/dra}
    username: ${DRA_DB_USER:dra}
    password: ${DRA_DB_PASSWORD:dra}

  ai:
    anthropic:
      # No api-key here: Spring AI reads ANTHROPIC_API_KEY from the environment
      chat:
        options:
          model: claude-haiku-4-5
          temperature: 0.0

    # all-MiniLM-L6-v2 (ONNX) runs locally, so a given text always yields the same vector
    model:
      embedding: transformers

    embedding:
      transformer:
        tokenizer:
          # The jar ships a real tokenizer.json but its model.onnx is a 133-byte Git LFS pointer
          uri: classpath:/onnx/all-MiniLM-L6-v2/tokenizer.json
        cache:
          # Aligns with the directory a bare TransformersEmbeddingModel uses, otherwise the same
          # model is cached twice and one of the two paths re-downloads 86 MB on every run
          directory: ${java.io.tmpdir}/spring-ai-onnx-generative

    mcp:
      client:
        name: dispute-agent
        version: 0.1.0
        type: SYNC
        # true means the handshake happens during context refresh: the peer must already be up,
        # so its lifecycle now belongs to compose rather than to this client (see ADR-0016)
        initialized: true
        request-timeout: 30s
        streamable-http:
          connections:
            payments:
              url: ${DRA_MCP_PAYMENTS_URL:http://localhost:8081}
              endpoint: /mcp

    vectorstore:
      pgvector:
        # Flyway owns the DDL: two owners for one schema means nobody knows what is in the database
        initialize-schema: false
        table-name: rule_chunk
        # Must match the VECTOR(384) of the migration; a mismatch only shows on first insert
        dimensions: 384
        index-type: HNSW
        distance-type: COSINE_DISTANCE

dra:
  # No matchIfMissing on any adapter condition: an absent property fails startup by design,
  # rather than electing an implicit winner
  security:
    # Empty by default: the application refuses to start without it (see ADR-0020)
    api-key: ${DRA_API_KEY:}
  persistence: ${DRA_PERSISTENCE:jdbc}
  agent:
    decision-version: "decision-llm@v1.2.0"
    evidence-version: "evidence-llm@v1.0.0"
    # Spring AI's tool-calling loop exposes no turn limit: this is the only bound
    max-tool-calls: 8
  orchestrator:
    # 1000.00 EUR in minor units; a business threshold gets renegotiated, so config not a constant
    escalation-threshold-minor-units: 100000
    # Calendar days, not business days - the rule corpus says so explicitly
    representment-min-days-remaining: 3
    # Marks the decisions taken with no model involved. The orchestrator@ prefix is matched
    # by DecisionView to label provenance, so renaming it relabels those decisions as MODEL.
    version: "orchestrator@v1.0.0"
  validation:
    known-reason-codes: "10.4,11.3,12.6,13.1,13.2,13.3,4808,4834,4837,4853,4855"
  rag:
    store: ${DRA_RAG_STORE:pgvector}
    # candidates drives recall, top-k drives how much noise reaches the prompt
    candidates: 50
    top-k: 5
    # heuristic | llm | none. none is the measurement control arm, not a production value.
    reranker: heuristic
  mcp:
    # Sent as X-MCP-Secret on every outbound call; must match the MCP server
    shared-secret: ${DRA_MCP_SHARED_SECRET:}
    # No longer launched by the client: this path is now used by the test fixture only
    payment-server-jar: ../mcp-payment-server/target/mcp-payment-server-0.1.0-SNAPSHOT.jar
  submission:
    # Small on purpose: concurrency costs model calls before it costs CPU
    worker-pool-size: 4

server:
  port: ${DRA_SERVER_PORT:8080}
  shutdown: graceful

spring.lifecycle:
  # A dispute takes ~20 s: a shorter budget would cut exactly what graceful shutdown protects
  timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        # Compose probes readiness, which only turns UP at ApplicationReadyEvent - after the
        # corpus has been indexed inside a @Bean method
        enabled: true
      show-details: never
