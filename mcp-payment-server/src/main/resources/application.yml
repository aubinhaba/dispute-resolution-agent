# Under STDIO, stdout carries JSON-RPC: any stray byte breaks the client handshake
spring:
  application:
    name: mcp-payment-server
  main:
    web-application-type: none
    banner-mode: off
  ai:
    mcp:
      server:
        stdio: true
        name: mcp-payment-server
        version: 0.1.0
        type: SYNC
        # Sent to the client at initialization; it may inject this into its LLM context
        instructions: >
          Read-only payment dispute evidence tools. Start with get_transaction to retrieve the
          disputed transaction and its risk signals, then enrich with get_customer_history,
          get_related_transactions, and get_fulfillment_record (for goods-not-received claims).
          All data is tokenized: customerRef is a token, card numbers are last-4 only.

logging:
  threshold:
    # OFF at the source; blanking the console pattern instead makes Logback complain on stderr
    console: OFF
  file:
    name: target/mcp-payment-server.log
