spring:
  application:
    name: mcp-payment-server
  ai:
    mcp:
      server:
        # Not redundant with the field default: the STREAMABLE condition carries
        # matchIfMissing=false while the SSE one carries true, so an absent property elects SSE
        protocol: STREAMABLE
        name: mcp-payment-server
        version: 0.1.0
        type: SYNC
        streamable-http:
          # The client references this path in its URL: the two must agree
          mcp-endpoint: /mcp
        # Sent to the client at initialization; it may inject this into its LLM context
        instructions: >
          Read-only payment dispute evidence tools. Start with get_transaction to retrieve the
          disputed transaction and its risk signals, then enrich with get_customer_history,
          get_related_transactions, and get_fulfillment_record (for goods-not-received claims).
          All data is tokenized: customerRef is a token, card numbers are last-4 only.

server:
  port: ${MCP_SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Compose and the test fixture wait on this probe; without it they would sleep instead
        include: health
  endpoint:
    health:
      probes:
        enabled: true

dra:
  mcp:
    # Empty: the server refuses to start rather than expose the tools (see ADR-0020)
    shared-secret: ${DRA_MCP_SHARED_SECRET:}
