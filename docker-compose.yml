# Start:    cp .env.example .env   then   docker compose up --build
# Submit:   POST http://localhost:8080/disputes
# Read:     GET  http://localhost:8080/disputes/{disputeId}
# Audit:    http://localhost:8080/audit.html

services:

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dra}
      POSTGRES_USER: ${POSTGRES_USER:-dra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dra}
    volumes:
      - dra-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dra} -d ${POSTGRES_DB:-dra}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mcp-payment-server:
    build:
      # Context is the repository root: the parent POM lives outside the module directory
      context: .
      dockerfile: mcp-payment-server/Dockerfile
    environment:
      MCP_SERVER_PORT: 8081
      DRA_MCP_SHARED_SECRET: ${DRA_MCP_SHARED_SECRET:?missing - copy .env.example to .env}
    ports:
      - "${MCP_SERVER_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  dispute-agent:
    build:
      context: .
      dockerfile: dispute-agent/Dockerfile
    depends_on:
      mcp-payment-server:
        condition: service_healthy
      postgres:
        # Same reason: Flyway and pgvector indexing also happen during refresh
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DRA_SERVER_PORT: 8080
      DRA_MCP_PAYMENTS_URL: http://mcp-payment-server:8081
      DRA_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dra}
      DRA_DB_USER: ${POSTGRES_USER:-dra}
      DRA_DB_PASSWORD: ${POSTGRES_PASSWORD:-dra}
      DRA_API_KEY: ${DRA_API_KEY:?missing - copy .env.example to .env}
      DRA_MCP_SHARED_SECRET: ${DRA_MCP_SHARED_SECRET:?missing - copy .env.example to .env}
    ports:
      - "${DRA_SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      # Longer than the MCP server: the agent loads 86 MB of ONNX and indexes ~90 chunks first
      start_period: 60s
    # Must stay consistent with spring.lifecycle.timeout-per-shutdown-phase, or Docker kills
    # exactly what Spring is protecting
    stop_grace_period: 40s

# The audit trail must outlive the container: that is the definition of an audit trail
volumes:
  dra-postgres:
