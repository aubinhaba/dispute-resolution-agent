# Runs the full suite without an API key. RAG uses a local ONNX embedding model, the REST
# topology runs against stubbed model ports, and persistence runs on Testcontainers. Tests
# that need a real model are gated on the key and self-skip here; eval-gate.yml runs those.

name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Requires a Docker daemon: the integration tests start a pgvector/pgvector:pg17 container
    # for the append-only history and the vector index
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up the JDK
        uses: actions/setup-java@v4
        with:
          # Java 21, not 25: the migration is deferred (see ADR-0019)
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Full verify, without a key
        # verify rather than test: the *IT classes run in the verify phase (Failsafe), which is
        # where the REST topology, persistence and RAG are exercised
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publish test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7
