# Measures a non-deterministic system, kept separate from build.yml. The harness replays 30
# labelled cases against real model calls: minutes of wall time and roughly 90-120 billed
# calls, which is too expensive to run on every push.
#
# Fails when the secret is absent rather than skipping silently, so a missing secret cannot
# be mistaken for a passing gate.

name: eval-gate

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Before any build, so the cause is named. Without this guard a missing secret surfaces
      # as an API 400 several minutes in, on the nominal code path, where it looks like a
      # regression
      - name: Is the secret configured?
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is missing. This workflow measures the system"
            echo "::error::against real model calls and can measure nothing without a key."
            echo "::error::Set it in Settings > Secrets > Actions."
            exit 1
          fi

      - name: Set up the JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Eval harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # EvalHarnessIT writes target/eval-report.json and carries its own floor thresholds.
        # Floors rather than equalities: two runs of the same code give 0.85 and 0.90, so a
        # gate asserting equality would be red half the time
        run: ./mvnw -B --no-transfer-progress verify -Dit.test=EvalHarnessIT

      - name: Publish the eval report
        # always(): the report from a failing run is the one worth reading
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: dispute-agent/target/eval-report.json
          retention-days: 30
