name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # No ANTHROPIC_API_KEY is supplied: the live-model tests self-skip via
      # @EnabledIfEnvironmentVariable. Unit tests, ArchUnit boundaries and the
      # retrieval measurements (local ONNX embeddings) all still run.
      - run: mvn -B --no-transfer-progress verify
